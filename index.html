<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
html{color-scheme:dark}body{margin:0}
/* Layout: full-viewport terminal. Topbar + ticker tape on top; chart (left, with a depth column beside it),
   a tabbed blotter underneath, and a right column holding markets over the order ticket.
   Phones collapse to one panel at a time behind a bottom nav. */
:root {
  --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-brand: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
  --bg: #070a11;
  --s1: #0c1019;
  --s2: #111624;
  --s3: #171e2f;
  --s4: #212a40;
  --line: #1d2535;
  --line-2: #2a3550;
  --fg: #e8ebf3;
  --fg-2: #a2abc2;
  --fg-3: #69738f;
  --accent: #e2b457;
  --accent-ink: #1a1405;
  --accent-soft: rgba(226, 180, 87, .14);
  --up: #27d6a0;
  --down: #ff5c74;
  --up-soft: rgba(39, 214, 160, .13);
  --down-soft: rgba(255, 92, 116, .13);
  --info: #6b9bff;
  --warn: #ffb454;
  --chart-bg: #090d15;
  --grid: rgba(125, 145, 195, .075);
  --crosshair: rgba(190, 200, 230, .5);
  --shadow: 0 14px 44px rgba(0, 0, 0, .55);
  --scrim: rgba(3, 5, 10, .66);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e8ebf2;
    --s1: #f4f6fa;
    --s2: #ffffff;
    --s3: #edf0f6;
    --s4: #dfe4ef;
    --line: #d8ddea;
    --line-2: #c3cadc;
    --fg: #121929;
    --fg-2: #444f68;
    --fg-3: #75809a;
    --accent: #a06c12;
    --accent-ink: #ffffff;
    --accent-soft: rgba(160, 108, 18, .12);
    --up: #0b9a6d;
    --down: #d33852;
    --up-soft: rgba(11, 154, 109, .12);
    --down-soft: rgba(211, 56, 82, .11);
    --info: #3a66d6;
    --warn: #b8730b;
    --chart-bg: #fbfcfe;
    --grid: rgba(40, 60, 110, .08);
    --crosshair: rgba(40, 55, 90, .5);
    --shadow: 0 14px 40px rgba(30, 40, 70, .22);
    --scrim: rgba(20, 28, 48, .45);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e8ebf2;
  --s1: #f4f6fa;
  --s2: #ffffff;
  --s3: #edf0f6;
  --s4: #dfe4ef;
  --line: #d8ddea;
  --line-2: #c3cadc;
  --fg: #121929;
  --fg-2: #444f68;
  --fg-3: #75809a;
  --accent: #a06c12;
  --accent-ink: #ffffff;
  --accent-soft: rgba(160, 108, 18, .12);
  --up: #0b9a6d;
  --down: #d33852;
  --up-soft: rgba(11, 154, 109, .12);
  --down-soft: rgba(211, 56, 82, .11);
  --info: #3a66d6;
  --warn: #b8730b;
  --chart-bg: #fbfcfe;
  --grid: rgba(40, 60, 110, .08);
  --crosshair: rgba(40, 55, 90, .5);
  --shadow: 0 14px 40px rgba(30, 40, 70, .22);
  --scrim: rgba(20, 28, 48, .45);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070a11;
  --s1: #0c1019;
  --s2: #111624;
  --s3: #171e2f;
  --s4: #212a40;
  --line: #1d2535;
  --line-2: #2a3550;
  --fg: #e8ebf3;
  --fg-2: #a2abc2;
  --fg-3: #69738f;
  --accent: #e2b457;
  --accent-ink: #1a1405;
  --accent-soft: rgba(226, 180, 87, .14);
  --up: #27d6a0;
  --down: #ff5c74;
  --up-soft: rgba(39, 214, 160, .13);
  --down-soft: rgba(255, 92, 116, .13);
  --info: #6b9bff;
  --warn: #ffb454;
  --chart-bg: #090d15;
  --grid: rgba(125, 145, 195, .075);
  --crosshair: rgba(190, 200, 230, .5);
  --shadow: 0 14px 44px rgba(0, 0, 0, .55);
  --scrim: rgba(3, 5, 10, .66);
}
/* colour-blind friendly pair, readable on both themes */
:root[data-cb="1"] { --up: #3b94f0; --down: #f2902e; --up-soft: rgba(59, 148, 240, .15); --down-soft: rgba(242, 144, 46, .15); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.35 var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; flex: none; }
.num, .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); }
.down { color: var(--down); }
.mute { color: var(--fg-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--line-2); background-clip: padding-box; border: 2px solid transparent; }
::-webkit-scrollbar-corner { background: transparent; }
kbd {
  font: 500 10px/1 var(--font-num);
  padding: 3px 5px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--fg-2);
  background: var(--s3);
}

#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; }

/* ---------- topbar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  height: 48px; padding: 0 12px;
  background: var(--s1);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--fg); flex: none; }
.brand-mark { width: 26px; height: 26px; }
.wordmark { font: italic 400 25px/1 var(--font-brand); letter-spacing: .005em; }
.brand-sub { font-size: 10.5px; color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 4px; }
.search-btn {
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 8px 0 10px; min-width: 250px; max-width: 340px; flex: 1 1 250px;
  border: 1px solid var(--line-2); border-radius: 7px; background: var(--s2); color: var(--fg-3);
  text-align: left;
}
.search-btn:hover { border-color: var(--fg-3); color: var(--fg-2); }
.search-btn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct { display: flex; align-items: stretch; gap: 0; margin-left: auto; min-width: 0; }
.stat { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-left: 1px solid var(--line); gap: 2px; min-width: 0; }
.stat span { font-size: 10px; color: var(--fg-3); letter-spacing: .04em; white-space: nowrap; }
.stat b { font: 500 13px/1.1 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-ctrl { display: flex; align-items: center; gap: 6px; flex: none; padding-left: 12px; border-left: 1px solid var(--line); }
.speed { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--fg-3); }
.speed select {
  height: 28px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--s2); color: var(--fg);
  font: 500 12px var(--font-num);
}
.icon-btn {
  width: 28px; height: 28px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--fg-2);
  border: 1px solid transparent; flex: none;
}
.icon-btn:hover { background: var(--s3); color: var(--fg); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 500; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* ---------- ticker tape ---------- */
.tape { height: 26px; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); position: relative; }
.tape::before, .tape::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2; pointer-events: none; }
.tape::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
.tape::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
.tape-track { display: inline-flex; height: 100%; align-items: center; white-space: nowrap; animation: tape 120s linear infinite; will-change: transform; }
.tape:hover .tape-track { animation-play-state: paused; }
@keyframes tape { to { transform: translateX(-50%); } }
.tk { display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; font-size: 11.5px; cursor: pointer; border-right: 1px solid var(--line); height: 100%; }
.tk b { font-weight: 600; color: var(--fg-2); }
.tk:hover b { color: var(--fg); }
.tk .num { font-size: 11.5px; }
@media (prefers-reduced-motion: reduce) { .tape-track { animation: none; } .tape { overflow-x: auto; } .pill::before { animation: none; } }

/* ---------- grid + panels ---------- */
.grid {
  display: grid; gap: 6px; padding: 6px; min-height: 0; min-width: 0;
  grid-template-columns: minmax(0, 1fr) 248px 344px;
  grid-template-rows: minmax(0, 1fr) 258px;
  grid-template-areas: "chart book side" "bottom bottom side";
}
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.chart-panel { grid-area: chart; }
.book-panel { grid-area: book; }
.bottom-panel { grid-area: bottom; }
.side { grid-area: side; display: grid; grid-template-rows: minmax(190px, 1fr) minmax(0, auto); gap: 6px; min-height: 0; min-width: 0; }

/* tabs */
.ptabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; height: 36px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { position: relative; height: 100%; padding: 0 10px; font-size: 12px; font-weight: 500; color: var(--fg-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.ptab:hover { color: var(--fg); }
.ptab[aria-selected="true"] { color: var(--fg); }
.ptab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.ptab .cnt { font: 500 10px var(--font-num); padding: 1px 5px; border-radius: 99px; background: var(--s4); color: var(--fg-2); }
.ptabs .grow { flex: 1; }
.ptabs .sum { display: flex; gap: 14px; font-size: 11px; color: var(--fg-3); white-space: nowrap; padding-left: 12px; }
.ptabs .sum b { font: 500 11.5px var(--font-num); color: var(--fg); margin-left: 4px; }

/* chips + segmented */
.chip { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; font-weight: 500; color: var(--fg-2); border: 1px solid var(--line); background: var(--s2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { color: var(--fg); border-color: var(--line-2); }
.chip[aria-pressed="true"], .chip.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.seg { display: inline-flex; gap: 1px; padding: 2px; border-radius: 7px; background: var(--s2); border: 1px solid var(--line); }
.seg button { height: 24px; min-width: 30px; padding: 0 8px; border-radius: 5px; font: 500 11.5px var(--font-num); color: var(--fg-3); }
.seg button:hover { color: var(--fg); background: var(--s3); }
.seg button[aria-pressed="true"] { background: var(--s4); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }

/* ---------- chart panel ---------- */
.chart-head { display: flex; align-items: center; gap: 12px; padding: 0 8px; height: 46px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.sym-pick { display: flex; align-items: center; gap: 9px; padding: 4px 8px 4px 4px; border-radius: 8px; flex: none; text-align: left; }
.sym-pick:hover { background: var(--s3); }
.sym-badge { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; font: 700 11px var(--font-ui); color: #fff; flex: none; letter-spacing: -.02em; }
.sym-name { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.sym-name b { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
.sym-name small { font-size: 10.5px; color: var(--fg-3); white-space: nowrap; }
.head-price { display: flex; align-items: baseline; gap: 8px; flex: none; }
.head-price b { font-size: 19px; font-weight: 500; }
.head-price span { font-size: 12px; }
.head-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; }
.tool-btn { height: 28px; padding: 0 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--fg-2); }
.tool-btn:hover, .tool-btn[aria-expanded="true"] { background: var(--s3); color: var(--fg); }
.dd { position: relative; }
.dd-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 190px; padding: 4px; border-radius: 8px; background: var(--s3); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.dd-menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 5px; font-size: 12.5px; color: var(--fg-2); text-align: left; }
.dd-menu button:hover { background: var(--s4); color: var(--fg); }
.dd-menu button[aria-checked="true"] { color: var(--accent); }

.chart-body { display: flex; flex: 1; min-height: 0; min-width: 0; }
.rail { width: 40px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; background: var(--s1); }
.rail::-webkit-scrollbar { display: none; }
.rail .sep { width: 22px; height: 1px; background: var(--line); margin: 5px 0; flex: none; }
.rail button { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--fg-3); position: relative; flex: none; }
.rail button:hover { background: var(--s3); color: var(--fg); }
.rail button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rail button::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 11px; padding: 4px 8px; border-radius: 5px; background: var(--s4); border: 1px solid var(--line-2); color: var(--fg); pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 40; }
.rail button:hover::after { opacity: 1; }

.chart-host { position: relative; flex: 1; min-width: 0; min-height: 0; background: var(--chart-bg); overflow: hidden; touch-action: none; }
.chart-host canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { position: absolute; left: 10px; top: 8px; z-index: 3; display: flex; flex-direction: column; gap: 3px; pointer-events: none; max-width: calc(100% - 90px); }
.lg-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; flex-wrap: wrap; }
.lg-row.ohlc { font: 500 11.5px var(--font-num); gap: 10px; }
.lg-row.ohlc span { color: var(--fg-3); }
.lg-row.ohlc em { font-style: normal; color: var(--fg); }
.lg-ind { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 1px 4px 1px 6px; border-radius: 5px; background: color-mix(in srgb, var(--chart-bg) 70%, transparent); }
.lg-ind .nm { color: var(--fg-2); font-size: 11px; }
.lg-ind .vals { font: 500 11px var(--font-num); }
.lg-ind .acts { display: none; gap: 1px; }
.lg-ind:hover .acts { display: inline-flex; }
.lg-ind .acts button { width: 20px; height: 20px; display: grid; place-items: center; color: var(--fg-3); border-radius: 4px; }
.lg-ind .acts button:hover { background: var(--s4); color: var(--fg); }
.lg-ind.off { opacity: .5; }
.hint-badge { position: absolute; right: 78px; top: 8px; z-index: 3; font-size: 11px; color: var(--fg-2); background: var(--s3); border: 1px solid var(--line-2); padding: 4px 9px; border-radius: 99px; display: none; align-items: center; gap: 8px; }
.hint-badge.show { display: inline-flex; }
.hint-badge b { color: var(--accent); font-weight: 600; }
.chart-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 0 8px; border-top: 1px solid var(--line); flex: none; }
.foot-l, .foot-r { display: flex; align-items: center; gap: 6px; }
.clock { font-size: 11px; color: var(--fg-3); margin-left: 6px; }

/* ---------- order book ---------- */
.book-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
.book-cols { display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 6px 10px 4px; font-size: 10px; color: var(--fg-3); letter-spacing: .03em; }
.book-cols span:not(:first-child) { text-align: right; }
.book-main { flex: none; }
.brow { position: relative; display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 0 10px; height: 18px; align-items: center; font: 400 11.5px var(--font-num); cursor: pointer; }
.brow span:not(:first-child) { text-align: right; color: var(--fg-2); }
.brow i { position: absolute; right: 0; top: 1px; bottom: 1px; z-index: 0; border-radius: 2px 0 0 2px; opacity: .9; transition: width .25s ease; }
.brow span { position: relative; z-index: 1; }
.brow:hover { background: var(--s3); }
.brow.ask span:first-child { color: var(--down); }
.brow.ask i { background: var(--down-soft); }
.brow.bid span:first-child { color: var(--up); }
.brow.bid i { background: var(--up-soft); }
.book-mid { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 10px; margin: 3px 0; border-block: 1px solid var(--line); background: var(--s2); }
.book-mid b { font-size: 16px; font-weight: 500; }
.book-mid span { font-size: 10.5px; }
.depth-wrap { height: 92px; flex: none; margin: 8px 8px 2px; border-radius: 6px; background: var(--chart-bg); border: 1px solid var(--line); position: relative; overflow: hidden; }
.depth-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tape-wrap { display: flex; flex-direction: column; min-height: 120px; flex: 1; }
.trades { flex: 1; overflow: hidden; }
.trow { display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 0 10px; height: 17px; align-items: center; font: 400 11px var(--font-num); color: var(--fg-3); }
.trow span:not(:first-child) { text-align: right; }
.trow span:nth-child(2) { color: inherit; }
.trow.u span:nth-child(2) { color: var(--up); }
.trow.d span:nth-child(2) { color: var(--down); }
.trow.big { background: var(--s2); }
.trow.big span:nth-child(3) { color: var(--fg); font-weight: 600; }

/* ---------- watchlist ---------- */
.watch-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.wl-tools { display: flex; flex-direction: column; gap: 6px; padding: 8px; flex: none; }
.chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: none; }
.field { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--s2); color: var(--fg-3); min-width: 0; }
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 12px; }
.wl-head, .wl-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 62px 52px; align-items: center; gap: 6px; padding: 0 10px; }
.wl-head { font-size: 10px; color: var(--fg-3); height: 22px; flex: none; letter-spacing: .03em; border-bottom: 1px solid var(--line); }
.wl-head span:nth-child(2), .wl-head span:nth-child(3), .wl-row .p, .wl-row .c { text-align: right; }
.wl-list { flex: 1; overflow-y: auto; min-height: 0; }
.wl-row { height: 33px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); position: relative; }
.wl-row:hover { background: var(--s2); }
.wl-row.sel { background: var(--s3); box-shadow: inset 2px 0 0 var(--accent); }
.wl-row .s { display: flex; align-items: center; gap: 7px; min-width: 0; }
.wl-row .s b { font-weight: 600; font-size: 12px; }
.wl-row .s small { color: var(--fg-3); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wl-row .star { color: var(--fg-3); opacity: 0; width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
.wl-row:hover .star, .wl-row .star.on { opacity: 1; }
.wl-row .star.on { color: var(--accent); }
.wl-row .p, .wl-row .c { font: 500 12px var(--font-num); }
.wl-row .c { font-size: 11.5px; }
.wl-row svg.spark { width: 52px; height: 18px; }
.wl-row.flash-u { animation: fu .6s ease-out; }
.wl-row.flash-d { animation: fd .6s ease-out; }
@keyframes fu { from { background: var(--up-soft); } }
@keyframes fd { from { background: var(--down-soft); } }
.cls-dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }

/* heatmap + news */
.heat { position: relative; flex: 1; margin: 8px; border-radius: 6px; overflow: hidden; min-height: 150px; }
.hm { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--s1); border-radius: 3px; cursor: pointer; overflow: hidden; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); transition: background-color .5s; line-height: 1.15; }
.hm b { font-size: 12px; font-weight: 600; }
.hm span { font: 500 10.5px var(--font-num); opacity: .92; }
.hm:hover { outline: 2px solid var(--fg); outline-offset: -2px; z-index: 2; }
.hm-legend { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 8px; font: 500 10px var(--font-num); color: var(--fg-3); flex: none; }
.hm-legend i { flex: 1; height: 6px; margin: 0 8px; border-radius: 4px; background: linear-gradient(90deg, var(--down), var(--s4), var(--up)); }
.news { flex: 1; overflow-y: auto; min-height: 0; }
.nw { display: block; width: 100%; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.nw:hover { background: var(--s2); }
.nw .m { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--fg-3); margin-bottom: 3px; }
.nw .m .tag { font-weight: 600; color: var(--fg-2); }
.nw .m .imp { display: inline-flex; gap: 2px; }
.nw .m .imp i { width: 4px; height: 8px; border-radius: 1px; background: var(--s4); }
.nw .m .imp i.on { background: var(--warn); }
.nw .t { font-size: 12.5px; line-height: 1.35; color: var(--fg); }
.nw.fresh { animation: fu 1.4s ease-out; }
.nw.fresh.neg { animation-name: fd; }

/* ---------- order ticket ---------- */
.ticket-panel { overflow-y: auto; max-height: min(660px, 62vh); }
.tk-head { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px; flex: none; border-bottom: 1px solid var(--line); }
.tk-sym { display: flex; align-items: center; gap: 8px; }
.tk-sym .sym-badge { width: 22px; height: 22px; border-radius: 6px; font-size: 9px; }
.tk-sym b { font-size: 13px; }
.tk-sym .mute { font-size: 11px; margin-left: auto; }
.tk-prices { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.px-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 6px 6px; border-radius: 8px; border: 1px solid transparent; transition: filter .15s, transform .08s; }
.px-btn small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.px-btn b { font-size: 16px; font-weight: 500; }
.px-btn.sell { background: var(--down-soft); color: var(--down); border-color: color-mix(in srgb, var(--down) 30%, transparent); }
.px-btn.buy { background: var(--up-soft); color: var(--up); border-color: color-mix(in srgb, var(--up) 30%, transparent); }
.px-btn:hover { filter: brightness(1.15); }
.px-btn:active { transform: scale(.98); }
.px-btn.on.sell { background: var(--down); color: #fff; }
.px-btn.on.buy { background: var(--up); color: #04150f; }
.spread { font-size: 10.5px; padding: 2px 6px; border-radius: 99px; background: var(--s3); }
.tk-body { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 9px; }
.tk-body::after { content: ""; height: 0; }
.seg.wide { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg.wide button { font-family: var(--font-ui); }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > label, .f > .lbl { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--fg-3); letter-spacing: .02em; }
.f > label b, .f > .lbl b { font: 500 11px var(--font-num); color: var(--fg); }
.inp { display: flex; align-items: center; height: 32px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--s2); min-width: 0; overflow: hidden; }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp input { flex: 1; min-width: 0; width: 100%; height: 100%; padding: 0 9px; background: none; border: 0; outline: 0; font: 500 13px var(--font-num); text-align: right; color: var(--fg); }
.inp .u { padding-right: 9px; font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.inp button { width: 28px; height: 100%; display: grid; place-items: center; color: var(--fg-3); border-left: 1px solid var(--line); flex: none; font: 500 14px var(--font-num); }
.inp button:first-child { border-left: 0; border-right: 1px solid var(--line); }
.inp button:hover { background: var(--s3); color: var(--fg); }
.inp.bad { border-color: var(--down); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.qp button { height: 22px; border-radius: 5px; font: 500 10.5px var(--font-num); color: var(--fg-2); background: var(--s2); border: 1px solid var(--line); }
.qp button:hover { color: var(--fg); border-color: var(--line-2); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--s4) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--s4); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--fg); border: 3px solid var(--accent); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 3px solid var(--accent); }
.sum { display: grid; gap: 5px; padding: 9px 10px; border-radius: 8px; background: var(--s2); border: 1px solid var(--line); font-size: 11.5px; }
.sum div { display: flex; justify-content: space-between; gap: 8px; color: var(--fg-3); }
.sum b { font: 500 11.5px var(--font-num); color: var(--fg); }
.submit { flex: none; position: sticky; bottom: 0; box-shadow: 0 -10px 12px -6px var(--s1); height: 42px; border-radius: 9px; font-size: 14px; font-weight: 600; letter-spacing: .01em; transition: filter .15s, transform .08s; }
.submit.buy { background: var(--up); color: #04150f; }
.submit.sell { background: var(--down); color: #fff; }
.submit:hover { filter: brightness(1.1); }
.submit:active { transform: scale(.99); }
.submit:disabled { filter: grayscale(.7) brightness(.6); cursor: not-allowed; }
.tk-msg { font-size: 11px; color: var(--warn); min-height: 14px; margin-top: -4px; }
.tk-msg.err { color: var(--down); }

/* ---------- tables (blotter) ---------- */
.bottom-body { flex: 1; min-height: 0; overflow: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 860px; }
.tbl th { position: sticky; top: 0; z-index: 2; background: var(--s1); text-align: right; font-weight: 500; font-size: 10.5px; color: var(--fg-3); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; letter-spacing: .02em; }
.tbl td { text-align: right; padding: 0 10px; height: 31px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); font: 400 12px var(--font-num); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr:hover td { background: var(--s2); }
.tbl td.sy { font-family: var(--font-ui); font-weight: 600; cursor: pointer; }
.tbl td .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font: 600 10px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; }
.tag.buy { background: var(--up-soft); color: var(--up); }
.tag.sell { background: var(--down-soft); color: var(--down); }
.tag.n { background: var(--s4); color: var(--fg-2); }
.tbl input.cell { width: 86px; height: 22px; background: var(--s2); border: 1px solid var(--line); border-radius: 5px; color: var(--fg); text-align: right; padding: 0 6px; font: 400 11.5px var(--font-num); }
.tbl input.cell:focus { border-color: var(--accent); outline: 0; }
.tbl .acts { display: inline-flex; gap: 4px; }
.sbtn { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11px; font-weight: 500; color: var(--fg-2); border: 1px solid var(--line-2); background: var(--s2); }
.sbtn:hover { color: var(--fg); background: var(--s3); }
.sbtn.danger:hover { color: var(--down); border-color: var(--down); }
.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 34px 16px; color: var(--fg-3); font-size: 12.5px; }
.empty b { color: var(--fg-2); font-size: 13px; font-weight: 600; }

/* portfolio */
.pf { display: grid; grid-template-columns: minmax(260px, 1.5fr) minmax(280px, 1.2fr) minmax(200px, 1fr); gap: 10px; padding: 10px; height: 100%; min-height: 200px; }
.pf-card { border: 1px solid var(--line); border-radius: 8px; background: var(--s2); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
.pf-card h4 { margin: 0; font-size: 11px; font-weight: 500; color: var(--fg-3); letter-spacing: .03em; }
.pf-card canvas { width: 100%; flex: 1; min-height: 120px; display: block; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; }
.kpi span { display: block; font-size: 10.5px; color: var(--fg-3); }
.kpi b { font: 500 14px var(--font-num); }
.alloc { display: flex; align-items: center; gap: 12px; flex: 1; min-height: 0; }
.alloc canvas { width: 120px; height: 120px; flex: none; min-height: 0; }
.alloc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 11.5px; flex: 1; }
.alloc li { display: flex; align-items: center; gap: 7px; color: var(--fg-2); }
.alloc li b { margin-left: auto; font: 500 11.5px var(--font-num); color: var(--fg); }
.al-form { display: flex; gap: 8px; align-items: flex-end; padding: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.al-form .f { width: 130px; }
.impact { display: inline-flex; gap: 2px; }
.impact i { width: 4px; height: 10px; border-radius: 1px; background: var(--s4); }
.impact i.on { background: var(--warn); }

/* ---------- overlays ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: start center; padding: 9vh 16px 16px; background: var(--scrim); backdrop-filter: blur(3px); }
.sheet { width: min(640px, 100%); max-height: 80vh; display: flex; flex-direction: column; background: var(--s2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: rise .16s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sheet-h h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
.sheet-h input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; color: var(--fg); min-width: 0; }
.sheet-b { overflow-y: auto; padding: 6px; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; color: var(--fg-2); }
.res:hover, .res.act { background: var(--s4); color: var(--fg); }
.res b { font-weight: 600; color: var(--fg); }
.res small { color: var(--fg-3); }
.res .r { margin-left: auto; display: flex; gap: 8px; align-items: center; font: 500 11.5px var(--font-num); }
.res-h { padding: 10px 10px 4px; font-size: 10.5px; color: var(--fg-3); letter-spacing: .05em; text-transform: uppercase; }
.ind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.sc { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; padding: 14px 18px 18px; font-size: 12.5px; color: var(--fg-2); }
.sc div { display: contents; }
.sc dt { margin: 0; }
.sc kbd { margin-left: 4px; }
.ctx { position: fixed; z-index: 90; min-width: 220px; padding: 4px; border-radius: 9px; background: var(--s3); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.ctx button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 5px; font-size: 12.5px; color: var(--fg-2); text-align: left; }
.ctx button:hover { background: var(--s4); color: var(--fg); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.ctx .b { color: var(--up); } .ctx .s { color: var(--down); }
.popover { position: fixed; z-index: 95; width: 230px; padding: 12px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line-2); box-shadow: var(--shadow); display: grid; gap: 10px; }
.popover h5 { margin: 0; font-size: 12px; font-weight: 600; }
#toasts { position: fixed; left: 14px; bottom: 14px; z-index: 120; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: calc(100vw - 28px); }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; min-width: 260px; max-width: 360px; padding: 10px 12px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 12.5px; animation: rise .2s ease-out; }
.toast::before { content: ""; width: 3px; align-self: stretch; border-radius: 3px; background: var(--info); flex: none; }
.toast.ok::before { background: var(--up); } .toast.bad::before { background: var(--down); } .toast.warn::before { background: var(--warn); }
.toast b { display: block; font-weight: 600; margin-bottom: 1px; }
.toast span { color: var(--fg-2); }
.toast.out { opacity: 0; transform: translateY(6px); transition: .25s; }

/* ---------- mobile nav ---------- */
.mnav { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1380px) {
  .grid { grid-template-columns: minmax(0, 1fr) 222px 328px; }
  .stat:nth-child(2), .stat:nth-child(4) { display: none; }
}
@media (max-width: 1180px) {
  .grid { grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "chart side" "bottom side"; }
  .book-panel { display: none; }
  .brand-sub, .speed { display: none; }
  .book-wrap { display: flex; flex-direction: column; min-height: 0; }
}
@media (max-width: 860px) {
  #app { grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .topbar { gap: 8px; padding: 0 8px; }
  .search-btn { min-width: 0; flex: none; width: 32px; padding: 0; justify-content: center; }
  .search-btn span, .search-btn kbd { display: none; }
  .acct { margin-left: auto; }
  .stat { padding: 0 8px; }
  .stat:nth-child(n+4), .stat:nth-child(2) { display: none; }
  .clock { display: none; }
  .tb-ctrl { padding-left: 6px; gap: 2px; }
  .tb-ctrl .pill { display: none; }
  .wordmark { font-size: 22px; }
  .grid { display: flex; flex-direction: column; padding: 0; gap: 0; }
  .side { display: contents; }
  .panel { display: none; flex: 1; border-radius: 0; border-width: 0; }
  #app[data-view="chart"] #pChart, #app[data-view="markets"] #pWatch, #app[data-view="trade"] #pTicket,
  #app[data-view="book"] #pBook, #app[data-view="portfolio"] #pBottom { display: flex; }
  .book-panel { display: flex; }
  #app:not([data-view="book"]) .book-panel { display: none; }
  .chart-head { height: auto; flex-wrap: wrap; padding: 6px 8px; gap: 6px 10px; }
  .head-price b { font-size: 16px; }
  .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; order: 5; flex: 1 0 100%; }
  .seg button { flex: 1; }
  .head-tools { margin-left: auto; }
  .tool-btn span { display: none; }
  .tool-btn #typeLbl { display: none; }
  .chart-body { flex-direction: column; }
  .rail { width: auto; height: 40px; flex-direction: row; padding: 0 6px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; justify-content: flex-start; }
  .rail .sep { width: 1px; height: 22px; margin: 0 5px; }
  .rail button::after { display: none; }
  .hint-badge { right: 70px; }
  .depth-wrap { height: 110px; }
  .pf { grid-template-columns: 1fr; height: auto; }
  .tbl { min-width: 760px; }
  .mnav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--s1); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .mnav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; font-size: 10.5px; color: var(--fg-3); }
  .mnav button[aria-selected="true"] { color: var(--accent); }
  #toasts { bottom: 70px; left: 8px; }
  .ticket-panel .tk-body { padding-bottom: 24px; }
  .wl-head, .wl-row { grid-template-columns: minmax(0, 1fr) 90px 66px 52px; }
}
@media (max-height: 760px) and (min-width: 861px) {
  .grid { grid-template-rows: minmax(0, 1fr) 210px; }
}
.chart-panel.full { position: fixed; inset: 0; z-index: 60; border-radius: 0; }
#pChart:fullscreen { border-radius: 0; border: 0; }

@media (max-width: 480px) { .stat:nth-child(3) { display: none; } .stat b { font-size: 13px; } }

</style>
</head>
<body>
<div id="app" data-view="chart">
  <header class="topbar">
    <a class="brand" href="#chart" aria-label="Aurelia Terminal">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--s3)" stroke="var(--line-2)"/>
        <path d="M6 22 L12 14 L17 18 L26 8" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="8" r="2.4" fill="var(--accent)"/>
        <path d="M6 26 H26" stroke="var(--fg-3)" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
      </svg>
      <span class="wordmark">Aurelia</span>
      <span class="brand-sub">Terminal</span>
    </a>
    <button class="search-btn" id="openPalette" aria-label="Search markets or commands">
      <i data-i="search"></i><span>Search markets, indicators, commands</span><kbd>Ctrl K</kbd>
    </button>
    <div class="acct" id="acctBar">
      <div class="stat"><span>Equity</span><b id="aEq">0.00</b></div>
      <div class="stat"><span>Balance</span><b id="aBal">0.00</b></div>
      <div class="stat"><span>Open P&amp;L</span><b id="aPnl">0.00</b></div>
      <div class="stat"><span>Margin used</span><b id="aMar">0.00</b></div>
      <div class="stat"><span>Margin level</span><b id="aLvl">&mdash;</b></div>
    </div>
    <div class="tb-ctrl">
      <span class="pill" title="All prices, order books and fills are simulated. No real money is involved.">Paper trading</span>
      <label class="speed" title="How fast simulated market time runs">Speed
        <select id="speedSel" aria-label="Simulation speed"></select>
      </label>
      <button class="icon-btn" id="btnTheme" title="Switch light / dark theme" aria-label="Switch theme"><i data-i="moon"></i></button>
      <button class="icon-btn" id="btnCb" title="Colour-blind friendly up/down colours" aria-label="Colour-blind palette" aria-pressed="false"><i data-i="eye"></i></button>
      <button class="icon-btn" id="btnHelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><i data-i="help"></i></button>
    </div>
  </header>

  <div class="tape" aria-label="Market ticker"><div class="tape-track" id="tapeTrack"></div></div>

  <main class="grid" id="grid">
    <section class="panel chart-panel" id="pChart" aria-label="Chart">
      <div class="chart-head">
        <button class="sym-pick" id="symPick" aria-label="Change symbol">
          <span class="sym-badge" id="chBadge"></span>
          <span class="sym-name"><b id="chSym">BTCUSD</b><small id="chName">Bitcoin / US Dollar</small></span>
          <i data-i="chev"></i>
        </button>
        <div class="head-price"><b class="num" id="hpLast">0</b><span class="num" id="hpChg">0.00%</span></div>
        <div class="seg" id="tfSeg" role="group" aria-label="Timeframe"></div>
        <div class="head-tools">
          <div class="dd">
            <button class="tool-btn" id="btnType" aria-haspopup="true"><i data-i="candles"></i><span id="typeLbl">Candles</span><i data-i="chev"></i></button>
            <div class="dd-menu" id="menuType" hidden></div>
          </div>
          <button class="tool-btn" id="btnInd"><i data-i="activity"></i><span>Indicators</span></button>
          <button class="icon-btn" id="btnFs" title="Full screen chart" aria-label="Full screen chart"><i data-i="expand"></i></button>
        </div>
      </div>
      <div class="chart-body">
        <div class="rail" id="rail" role="toolbar" aria-label="Drawing tools"></div>
        <div class="chart-host" id="chartHost"></div>
      </div>

  context(o) {
    const i = IB[App.sym], p = o.price, bid = bidOf(i), ask = askOf(i), bt = p < ask ? 'limit' : 'stop', st = p > bid ? 'limit' : 'stop', c = $('#ctx');
    c.innerHTML = '<button class="b" data-a="b">Buy ' + bt + ' at ' + fmtP(i, p) + '</button><button class="s" data-a="s">Sell ' + st + ' at ' + fmtP(i, p) + '</button><hr><button data-a="al">' + ic('bell', 14) + ' Set price alert at ' + fmtP(i, p) + '</button><hr><button data-a="mb">Market buy ' + fmtN(Ticket.qty || i.dq, 3) + ' ' + i.unit + '</button><button data-a="ms">Market sell ' + fmtN(Ticket.qty || i.dq, 3) + ' ' + i.unit + '</button><hr><button data-a="fit">Reset chart view</button><button data-a="cl">Clear drawings</button>';
    c.hidden = false; c.style.left = Math.min(o.cx, innerWidth - 240) + 'px'; c.style.top = Math.min(o.cy, innerHeight - c.offsetHeight - 8) + 'px';
    c.onclick = e => { const b = e.target.closest('button'); if (!b) return; c.hidden = true; const a = b.dataset.a;
      if (a === 'b') Ticket.prefill({ side: 'buy', type: bt, price: p }); else if (a === 's') Ticket.prefill({ side: 'sell', type: st, price: p }); else if (a === 'al') Trade.addAlert(i.sym, p); else if (a === 'mb') Ticket.quick('buy'); else if (a === 'ms') Ticket.quick('sell'); else if (a === 'fit') App.chart.fit(); else App.chart.clearDrawings(); };
  },
  help() {
    const K = (a, b) => '<div><dt>' + a + '</dt><dd style="margin:0;text-align:right">' + b + '</dd></div>', k = (...x) => x.map(v => '<kbd>' + v + '</kbd>').join(' ');
    this.openModal('<div class="sheet" role="dialog" aria-label="Keyboard shortcuts"><div class="sheet-h"><h3>Keyboard shortcuts</h3><button class="icon-btn" id="hcl" aria-label="Close">' + ic('close') + '</button></div><div class="sheet-b"><dl class="sc">' +
      K('Search markets and commands', k('Ctrl', 'K') + ' or ' + k('/')) + K('Timeframes 1m to 1W', k('1') + ' to ' + k('8')) + K('Trend line, horizontal, vertical', k('T') + ' ' + k('H') + ' ' + k('V')) + K('Rectangle, fib, measure', k('R') + ' ' + k('F') + ' ' + k('M')) + K('Long or short position tool', k('L') + ' ' + k('Y')) + K('Text note, back to cursor', k('N') + ' ' + k('C')) + K('Delete selected drawing', k('Del')) + K('Cancel tool or close window', k('Esc')) +
      K('Market buy / sell at current size', k('Shift', 'B') + ' ' + k('Shift', 'S')) + K('Zoom chart', 'Scroll wheel') + K('Pan chart', 'Drag') + K('Scale price axis', 'Drag the right edge') + K('Move stop, target or order', 'Drag its line on the chart') + K('Order at a price', 'Right-click the chart') + K('Send risk/reward tool to ticket', 'Double-click it') + '</dl></div></div>');
    $('#hcl').onclick = () => this.closeModal();
  },
  keys(e) {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.palette(); return; }
    if (e.key === 'Escape') { this.closeModal(); $('#ctx').hidden = true; $('#pop').hidden = true; App.chart.setTool('cursor'); App.syncTools(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || !$('#modal').hidden) return;
    const c = App.chart, k = e.key;
    if (k === '/') { e.preventDefault(); this.palette(); } else if (k === '?') this.help();
    else if (k === 'Delete' || k === 'Backspace') { if (c.deleteSelected()) e.preventDefault(); }
    else if (k === 'B') Ticket.quick('buy'); else if (k === 'S') Ticket.quick('sell');
    else if (/^[1-8]$/.test(k)) App.setTf(TFS[+k - 1].s);
    else { const m = { t: 'trend', h: 'hline', v: 'vline', r: 'rect', f: 'fib', m: 'measure', l: 'long', y: 'short', n: 'text', c: 'cursor' }[k.toLowerCase()]; if (m && k === k.toLowerCase()) { c.setTool(m); App.syncTools(); } }
  }
};

/* ---------- start ---------- */
App.boot();

</script>
</body>
</html>
